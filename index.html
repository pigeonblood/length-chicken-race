<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#221B16">
  <meta name="description" content="画像の隠された長さを予想して、ギリギリを攻めるパーティーゲーム">
  <title>○○長さチキンレース！</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ============ ホーム ============ -->
  <section class="screen screen-home is-active" id="screen-home">
    <button class="sound-toggle home-sound" data-action="toggle-sound" aria-label="効果音のオン/オフ"></button>
    <div class="home-inner">
      <h1 class="logo" aria-label="○○長さチキンレース！">
        <span class="logo-row1" aria-hidden="true">
          <span class="logo-maru"><i></i><i></i></span>
          <span class="stroke logo-nagasa" data-text="長さ">長さ</span>
        </span>
        <span class="logo-row2" aria-hidden="true">
          <span class="stroke" data-text="チキンレース！">チキンレース！</span>
        </span>
        <span class="logo-ruler" aria-hidden="true">
          <span class="ruler-danger">ドボン</span>
          <span class="ruler-mark"></span>
        </span>
      </h1>

      <div class="home-buttons">
        <button class="btn btn-primary btn-xl" data-action="start">スタート</button>
        <button class="btn btn-lg" data-action="go-players">回答者を登録する</button>
      </div>

      <div class="home-score" id="home-score"></div>
    </div>
  </section>

  <!-- ============ 回答者登録 ============ -->
  <section class="screen screen-players" id="screen-players">
    <header class="topbar">
      <button class="btn-icon" data-action="go-home" aria-label="ホームに戻る">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2>回答者を登録する</h2>
    </header>
    <div class="players-body">
      <div class="card players-card">
        <form class="player-form" id="player-form" autocomplete="off">
          <input class="text-input" id="player-name" maxlength="12" placeholder="名前を入力（12文字まで）" enterkeyhint="done">
          <button class="btn btn-primary" type="submit" id="player-add">追加</button>
        </form>
        <div class="players-meta">
          <span id="player-count">0 / 12人</span>
          <span class="muted">色をタップで変更・▲▼で順番を入れ替え</span>
        </div>
        <ul class="player-list" id="player-list"></ul>
        <p class="empty-note" id="players-empty">まだ回答者がいません。名前を入れて「追加」しよう。</p>
        <div class="players-foot">
          <button class="btn btn-sm" data-action="reset-points">ポイントをリセット</button>
          <button class="btn btn-primary" data-action="go-home">完了</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 問題設定 ============ -->
  <section class="screen screen-setup" id="screen-setup">
    <header class="topbar">
      <button class="btn-icon" data-action="go-home" aria-label="ホームに戻る">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2>問題を設定する</h2>
    </header>

    <div class="setup-body">
      <div class="stage-wrap" id="setup-wrap">
        <label class="dropzone" id="setup-empty" for="file-input">
          <svg viewBox="0 0 48 48" width="56" height="56" aria-hidden="true"><rect x="5" y="9" width="38" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="17" cy="20" r="4" fill="currentColor"/><path d="M8 35l11-11 7 7 6-6 9 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>
          <strong>画像を選ぶ</strong>
          <span>タップして写真・ファイルを選択<br class="pc-only">（PCはここにドラッグ＆ドロップもOK）</span>
        </label>
        <div class="stage-fit" id="setup-fit">
          <div class="stage" id="setup-stage" hidden>
            <img id="setup-img" alt="お題の画像" draggable="false">
            <div class="preview" id="setup-preview">
              <svg class="preview-arrow" viewBox="0 0 48 48" aria-hidden="true"><path d="M6 24h30M26 12l12 12-12 12" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="sline" id="line-start" data-line="start" style="--c:#1FA15A">
              <div class="sline-bar"></div>
              <div class="sline-knob"><svg viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              <div class="sline-tag">スタート</div>
            </div>
            <div class="sline" id="line-answer" data-line="answer" style="--c:#E63B2E">
              <div class="sline-bar"></div>
              <div class="sline-knob"><svg viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              <div class="sline-tag">正解</div>
            </div>
          </div>
        </div>
      </div>

      <aside class="setup-side">
        <div class="setup-group setup-topic">
          <label class="field-label" for="topic-input">お題</label>
          <input class="text-input" id="topic-input" maxlength="10" placeholder="例：魚" enterkeyhint="done">
        </div>
        <div class="setup-group setup-import">
          <label class="btn btn-yellow btn-block" for="file-input">
            <span id="import-label">画像をインポート</span>
          </label>
          <input class="visually-hidden" type="file" id="file-input" accept="image/*">
        </div>
        <div class="setup-group setup-dir">
          <span class="field-label">開く向き</span>
          <div class="dpad" role="group" aria-label="開く向き">
            <button class="dpad-btn" data-dir="up" aria-label="上に向かって開く" style="grid-area:up"><svg viewBox="0 0 24 24"><path d="M12 20V5M5 11l7-7 7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button class="dpad-btn" data-dir="left" aria-label="左に向かって開く" style="grid-area:left"><svg viewBox="0 0 24 24"><path d="M20 12H5M11 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <span class="dpad-center" style="grid-area:mid"></span>
            <button class="dpad-btn" data-dir="right" aria-label="右に向かって開く" style="grid-area:right"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button class="dpad-btn" data-dir="down" aria-label="下に向かって開く" style="grid-area:down"><svg viewBox="0 0 24 24"><path d="M12 4v15M5 13l7 7 7-7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
        </div>
        <div class="setup-group setup-go">
          <p class="setup-hint">
            <span class="legend"><i style="--c:#1FA15A"></i>スタート：ここから先を隠す</span>
            <span class="legend"><i style="--c:#E63B2E"></i>正解：本当の端</span>
            <span class="muted">ラインはドラッグで調整</span>
          </p>
          <button class="btn btn-primary btn-lg btn-block" data-action="publish" id="publish-btn" disabled>出題</button>
        </div>
      </aside>
    </div>
  </section>

  <!-- ============ 出題・チキンレース・回答発表 ============ -->
  <section class="screen screen-play" id="screen-play">
    <header class="topbar play-topbar">
      <button class="btn-icon" data-action="quit" aria-label="中断する">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      </button>
      <h2 id="play-title">長さチキンレース！</h2>
      <span class="phase-badge" id="phase-badge"></span>
      <button class="sound-toggle" data-action="toggle-sound" aria-label="効果音のオン/オフ"></button>
    </header>

    <div class="play-body">
      <div class="stage-wrap play-wrap">
        <div class="stage-fit" id="play-fit">
          <div class="stage" id="play-stage">
            <img id="play-img" alt="お題の画像" draggable="false">
            <div class="mask" id="play-mask"><span class="mask-q">？</span></div>
            <div class="answer-line" id="answer-line" hidden><span class="answer-tag">正解</span></div>
            <div class="mk-layer" id="mk-lines"></div>
            <div class="mk-layer" id="mk-dias"></div>
          </div>
        </div>
        <div class="play-banner" id="play-banner" aria-live="polite"></div>
      </div>

      <aside class="play-side">
        <div class="board-wrap">
          <ol class="board" id="board"></ol>
        </div>
        <div class="action-panel">
          <p class="prompt" id="prompt" aria-live="polite"></p>
          <div class="actions" id="actions"></div>
        </div>
      </aside>
    </div>
  </section>
</div>

<!-- モーダル -->
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title"></h3>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
